<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapiACT - Patient Registration</title>
  <link rel="icon" type="image/jpg" href="static/images/logo.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
      --bg-secondary: #0f0f23;
      --bg-card: #16213e;
      --text-primary: #ffffff;
      --text-secondary: #a0aec0;
      --text-accent: #4facfe;
      --border-color: #2d3748;
      --shadow-light: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-medium: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      --shadow-large: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      --gradient-accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --glassmorphism: rgba(22, 33, 62, 0.25);
      --backdrop-blur: blur(15px);
      --error-color: #e74c3c;
    }
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background 0.3s ease;
    }
    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><g fill='rgba(79,172,254,0.03)'><path d='M20 0v40'/><path d='M0 20h40'/></g></svg>") repeat;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }
    /* Container */
    .registration_form {
      background: var(--glassmorphism);
      backdrop-filter: var(--backdrop-blur);
      max-width: 550px;
      width: 90%;
      margin: 110px auto 60px;
      padding: 45px 35px;
      border-radius: 25px;
      box-shadow: var(--shadow-medium);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      position: relative;
      z-index: 2;
      animation: fadeIn 0.6s ease-out;
      text-align: center;
    }
    .registration_form h3 {
      font-weight: 700;
      font-size: 2.2rem;
      margin-bottom: 30px;
      padding-bottom: 12px;
      position: relative;
      color: var(--text-primary);
    }
    .registration_form h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 60px;
      height: 4px;
      background: var(--gradient-accent);
      border-radius: 3px;
      transform: translateX(-50%);
    }
    .input_box {
      margin-bottom: 25px;
      text-align: left;
      position: relative;
    }
    .input_box label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: color 0.25s ease;
    }
    .input_box:focus-within label {
      color: var(--text-accent);
    }
    .required {
      color: var(--error-color);
      font-weight: 600;
      margin-left: 4px;
    }
    .input_box input,
    .input_box select,
    .input_box textarea {
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1.8px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .input_box input[type="file"] {
      padding: 8px;
      height: auto;
    }
    .input_box input:focus,
    .input_box select:focus,
    .input_box textarea:focus {
      outline: none;
      border-color: var(--text-accent);
      background-color: var(--bg-card);
      box-shadow: 0 0 8px var(--text-accent);
    }
    .input_box textarea {
      height: 100px;
      resize: none;
    }
    .phone_input {
      display: flex;
      align-items: center;
    }
    .phone_input span {
      background: var(--bg-secondary);
      padding: 0 15px;
      border-radius: 12px 0 0 12px;
      border: 1.8px solid var(--border-color);
      border-right: none;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 1rem;
      height: 48px;
      line-height: 48px;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      user-select: none;
    }
    .phone_input input {
      border-radius: 0 12px 12px 0;
      border-left: none;
      height: 48px;
      font-size: 1rem;
      padding: 12px 15px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1.8px solid var(--border-color);
      transition: border-color 0.3s ease, background-color 0.3s ease;
      font-family: 'Inter', sans-serif;
    }
    .phone_input:focus-within span {
      border-color: var(--text-accent);
      background-color: var(--bg-card);
    }
    button {
      width: 100%;
      padding: 14px 0;
      background: var(--gradient-accent);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-large);
      letter-spacing: 0.3px;
      transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    button:hover {
      background-color: var(--text-accent);
      box-shadow: var(--shadow-medium);
      transform: translateY(-3px);
    }
    button:active {
      transform: translateY(0);
      box-shadow: var(--shadow-light);
    }
    button::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.15);
      transition: left 0.5s ease;
      z-index: 1;
    }
    button:hover::after {
      left: 100%;
    }
    /* Responsive */
    @media (max-width: 600px) {
      .registration_form {
        margin: 90px 15px 40px;
        padding: 35px 25px;
      }
      h3 {
        font-size: 1.8rem;
      }
      .input_box input,
      .input_box select,
      .input_box textarea,
      .phone_input span,
      .phone_input input {
        height: 44px;
      }
      .phone_input span {
        padding: 0 12px;
        line-height: 44px;
      }
    }
    /* FadeIn animation */
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="registration_form" role="main" aria-labelledby="registration-heading">
    <h3 id="registration-heading">Patient Registration</h3>
    <form id="patientForm" novalidate>
      <div class="input_box">
        <label for="age">Age<span class="required">*</span></label>
        <input type="number" id="age" name="age" placeholder="Enter your age" required min="1" />
      </div>
      <div class="input_box">
        <label for="gender">Gender<span class="required">*</span></label>
        <select id="gender" name="gender" required>
          <option value="" disabled selected>Select your gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="input_box">
        <label for="photo">Photo<span class="required">*</span></label>
        <input type="file" id="photo" name="photo" accept="image/png, image/jpeg, image/jpg, image/gif, image/bmp, image/webp" required />
      </div>
      <div class="input_box">
        <label for="phone">Phone No<span class="required">*</span></label>
        <div class="phone_input">
          <span>+91</span>
          <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required pattern="[0-9]{10}" maxlength="10" oninput="validatePhone()" />
        </div>
      </div>
      <div class="input_box">
        <label for="address">Address<span class="required">*</span></label>
        <textarea id="address" name="address" placeholder="Enter your address" required></textarea>
      </div>
      <button type="submit">PROCEED</button>
    </form>
  </div>

  <script>
    function validatePhone() {
      const phoneInput = document.getElementById('phone');
      if (phoneInput.value.length > 10) {
        alert("Phone number cannot exceed 10 digits.");
        phoneInput.value = phoneInput.value.slice(0, 10);
      }
    }
    document.getElementById("patientForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = this;
      let submitButton = form.querySelector("button[type='submit']");
      let formData = new FormData(form);

      submitButton.disabled = true;
      submitButton.innerText = "Processing...";

      fetch("/patient_register", {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          alert(data.error);
          submitButton.disabled = false;
          submitButton.innerText = "PROCEED";
        } else {
          alert(data.message);
          window.location.href = data.redirect_url;
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("An error occurred. Please try again.");
        submitButton.disabled = false;
        submitButton.innerText = "PROCEED";
      });
    });
  </script>
</body>
</html>
