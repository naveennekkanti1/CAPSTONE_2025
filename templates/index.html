<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            overflow: hidden;
        }
        
        .countdown-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 4rem 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .countdown-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 3s infinite linear;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        
        .time-unit {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border-radius: 20px;
            padding: 2rem 1.5rem;
            min-width: 120px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .time-unit:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
        }
        
        .time-unit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .time-unit:hover::before {
            left: 100%;
        }
        
        .number {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            display: block;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
            margin-bottom: 0.5rem;
            line-height: 1;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }
        
        .label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 400;
            position: relative;
            z-index: 2;
        }
        
        .expired {
            color: #ff6b6b;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10px) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .pulse {
            animation: pulse 2s infinite ease-in-out;
        }
        
        @media (max-width: 768px) {
            .countdown-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            h1 {
                font-size: 1.8rem;
                margin-bottom: 2rem;
            }
            
            .countdown {
                gap: 1rem;
            }
            
            .time-unit {
                padding: 1.5rem 1rem;
                min-width: 100px;
            }
            
            .number {
                font-size: 2.5rem;
            }
            
            .label {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    
    <div class="countdown-container">
        <h1>Going Live with the New UI🚀</h1>
        <div class="countdown" id="countdown">
            <div class="time-unit pulse">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit pulse">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-unit pulse">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-unit pulse">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>
    </div>

    <script>
    // Fixed countdown date: 15 September 2025, 11:15 AM IST
    const countdownDate = new Date("Sep 16, 2025 11:15:00 GMT+0530").getTime();

    // Create floating particles
    function createParticles() {
        const particlesContainer = document.querySelector('.particles');
        
        setInterval(() => {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
            particle.style.animationDelay = Math.random() * 2 + 's';
            particlesContainer.appendChild(particle);
            
            // Remove particle after animation
            setTimeout(() => {
                particle.remove();
            }, 6000);
        }, 300);
    }
    
    // Update countdown
    function updateCountdown() {
        const now = new Date().getTime();
        const distance = countdownDate - now;
        
        if (distance < 0) {
            document.getElementById('countdown').innerHTML = '<div class="expired">🎉 Will Live SOON 🎉</div>';
            return;
        }
        
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        document.getElementById('days').textContent = days.toString().padStart(2, '0');
        document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
        document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
        document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        
        // Add extra pulse animation when seconds change
        if (seconds !== updateCountdown.lastSecond) {
            document.getElementById('seconds').parentElement.style.animation = 'none';
            setTimeout(() => {
                document.getElementById('seconds').parentElement.style.animation = 'pulse 2s infinite ease-in-out';
            }, 10);
            updateCountdown.lastSecond = seconds;
        }
    }
    
    // Initialize
    createParticles();
    updateCountdown();
    setInterval(updateCountdown, 1000);
    
    // Add click effects to time units
    document.querySelectorAll('.time-unit').forEach(unit => {
        unit.addEventListener('click', () => {
            unit.style.transform = 'scale(0.95)';
            setTimeout(() => {
                unit.style.transform = '';
            }, 150);
        });
    });
</script>
</body>
</html>
