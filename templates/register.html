<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapiACT - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      /* Dark Theme Colors */
      --bg-primary: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
      --bg-secondary: #0f0f23;
      --bg-card: #16213e;
      --text-primary: #ffffff;
      --text-secondary: #a0aec0;
      --text-accent: #4facfe;
      --border-color: #2d3748;
      --shadow-light: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-medium: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      --shadow-large: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-secondary: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
      --gradient-accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --glassmorphism: rgba(22, 33, 62, 0.25);
      --backdrop-blur: blur(15px);
    }

    [data-theme="light"] {
      --bg-primary: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      --bg-secondary: #ffffff;
      --bg-card: #f8f9fa;
      --text-primary: #1a202c;
      --text-secondary: #4a5568;
      --text-accent: #3182ce;
      --border-color: #cbd5e0;
      --shadow-light: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-medium: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
      --shadow-large: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --glassmorphism: rgba(255, 255, 255, 0.7);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    /* Navbar */
    nav.navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 1200px;
      padding: 15px 30px;
      background: var(--glassmorphism);
      backdrop-filter: var(--backdrop-blur);
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: var(--shadow-medium);
      transition: all 0.3s ease;
    }

    nav.navbar:hover {
      box-shadow: var(--shadow-large);
      transform: translateX(-50%) translateY(-2px);
    }

    nav.navbar .logo {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--text-accent);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
    }
    nav.navbar .logo i {
      font-size: 2.4rem;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    nav.navbar .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
      flex-wrap: wrap;
    }
    nav.navbar .nav-links a {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      padding: 6px 18px;
      border-radius: 10px;
      transition: all 0.3s ease;
      position: relative;
      font-size: 1rem;
    }
    nav.navbar .nav-links a:hover {
      color: var(--text-accent);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .theme-toggle, .language-toggle {
      background: var(--gradient-accent);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: var(--shadow-light);
      transition: all 0.3s ease;
    }
    .theme-toggle:hover, .language-toggle:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: var(--shadow-medium);
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g fill='rgba(79,172,254,0.03)'><path d='M20 0v40'/><path d='M0 20h40'/></g></svg>") repeat;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .signup_form {
      background: var(--glassmorphism);
      backdrop-filter: var(--backdrop-blur);
      max-width: 480px;
      margin: 120px auto 60px;
      border-radius: 25px;
      padding: 45px 35px;
      box-shadow: var(--shadow-medium);
      border: 1px solid var(--border-color);
      position: relative;
      z-index: 2;
      animation: fadeIn 0.5s ease forwards;
    }

    .signup_form h3 {
      font-weight: 700;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      color: var(--text-primary);
      padding-bottom: 12px;
    }
    .signup_form h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 60px;
      height: 4px;
      border-radius: 3px;
      background: var(--gradient-accent);
      transform: translateX(-50%);
    }

    .input_box {
      margin-bottom: 25px;
      position: relative;
    }

    .input_box label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }

    .input_box:focus-within label {
      color: var(--text-accent);
    }

    .input_box input,
    .input_box select {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: 1.8px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 12px 18px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    .input_box input:focus,
    .input_box select:focus {
      outline: none;
      border-color: var(--text-accent);
      background: var(--bg-card);
      box-shadow: 0 0 8px rgba(79, 172, 254, 0.3);
    }

    .input_box input::placeholder {
      color: var(--text-secondary);
    }

    .input_box input:disabled,
    .input_box select:disabled {
      background: var(--bg-secondary);
      border-color: var(--border-color);
      cursor: not-allowed;
      opacity: 0.7;
    }

    button {
      width: 100%;
      padding: 14px 0;
      border-radius: 16px;
      background: var(--gradient-accent);
      color: white;
      border: none;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: var(--shadow-large);
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button:hover:not(:disabled) {
      background: var(--text-accent);
      box-shadow: var(--shadow-medium);
      transform: translateY(-3px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.15);
      transition: left 0.5s ease;
    }

    button:hover:not(:disabled)::after {
      left: 100%;
    }

    #otpField,
    #verifyBtn {
      display: none;
      margin-top: 20px;
    }

    #verifyBtn {
      background: linear-gradient(135deg, #3cb371 0%, #2e8b57 100%);
      box-shadow: 0 4px 15px rgba(60, 179, 113, 0.3);
    }

    .error-message {
      color: #ff6b6b;
      font-size: 0.875rem;
      margin-top: 5px;
      display: none;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .signup_form {
        margin: 100px 20px;
        padding: 35px 25px;
      }
      nav.navbar {
        flex-wrap: wrap;
        justify-content: center;
        padding: 10px 20px;
      }
      nav.navbar .nav-links {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="#" class="logo" aria-label="RapiACT Home"><i class="fas fa-heartbeat"></i>RapiACT</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/">About</a>
    <a href="/services">Services</a>
    <a href="/all_doctors">Doctors</a>
    <a href="/">Contact</a>
    <a href="/login">Login</a>
    <button class="language-toggle" title="Change Language" aria-label="Change Language">
      <i class="fas fa-globe"></i>
    </button>
    <button class="theme-toggle" title="Toggle Dark/Light Theme" aria-label="Toggle Dark/Light Theme" onclick="toggleTheme()">
      <i class="fas fa-moon"></i>
    </button>
  </div>
</nav>

<div class="signup_form">
  <h3>RapiACT!❤️ Account</h3>
  <form id="signupForm" novalidate>
    <div class="input_box">
      <label for="role">I am a</label>
      <select id="role" name="role" required>
        <option value="">Select Role</option>
        <option value="Patient">Patient</option>
        <option value="Doctor">Doctor</option>
      </select>
      <div class="error-message" id="roleError">Please select a role</div>
    </div>
    <div class="input_box">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
        autocomplete="name"
      />
      <div class="error-message" id="nameError">Please enter your full name</div>
    </div>
    <div class="input_box">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
        autocomplete="email"
      />
      <div class="error-message" id="emailError">Please enter a valid email</div>
    </div>
    <div class="input_box">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a secure password (min 6 characters)"
        required
      />
      <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
    </div>
    <div class="input_box">
      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        required
      />
      <div class="error-message" id="confirmPasswordError">Passwords do not match</div>
    </div>
    <button type="button" id="sendOtpBtn">SEND VERIFICATION CODE</button>

    <div id="otpField" class="input_box">
      <label for="otp">Verification Code</label>
      <input type="text" id="otp" name="otp" placeholder="Enter 6-digit code" maxlength="6" />
      <div class="error-message" id="otpError">Please enter the 6-digit code</div>
    </div>
    <button type="button" id="verifyBtn">VERIFY & CONTINUE</button>
  </form>
</div>

<script>
  // Toggle Dark/Light theme - FIXED
  function toggleTheme() {
    const body = document.body;
    const themeToggleIcon = document.querySelector('.theme-toggle i');
    const currentTheme = body.getAttribute('data-theme');

    if (currentTheme === 'dark') {
      body.setAttribute('data-theme', 'light');
      themeToggleIcon.classList.replace('fa-moon', 'fa-sun');
      localStorage.setItem('theme', 'light');
    } else {
      body.setAttribute('data-theme', 'dark');
      themeToggleIcon.classList.replace('fa-sun', 'fa-moon');
      localStorage.setItem('theme', 'dark');
    }
  }

  // Load saved theme on page load - FIXED
  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    const themeToggleIcon = document.querySelector('.theme-toggle i');
    if (savedTheme === 'light') {
      themeToggleIcon.classList.replace('fa-moon', 'fa-sun');
    }
  });

  // Validation functions
  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function showError(fieldId, message) {
    const errorElement = document.getElementById(fieldId + 'Error');
    if (errorElement) {
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }
  }

  function hideError(fieldId) {
    const errorElement = document.getElementById(fieldId + 'Error');
    if (errorElement) {
      errorElement.style.display = 'none';
    }
  }

  function validateForm() {
    const form = document.getElementById('signupForm');
    const role = form.role.value.trim();
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const password = form.password.value;
    const confirmPassword = form.confirmPassword.value;

    let isValid = true;

    // Hide all errors first
    ['role', 'name', 'email', 'password', 'confirmPassword'].forEach(hideError);

    if (!role) {
      showError('role', 'Please select a role');
      isValid = false;
    }

    if (!name || name.length < 2) {
      showError('name', 'Please enter your full name (at least 2 characters)');
      isValid = false;
    }

    if (!email || !validateEmail(email)) {
      showError('email', 'Please enter a valid email address');
      isValid = false;
    }

    if (!password || password.length < 6) {
      showError('password', 'Password must be at least 6 characters');
      isValid = false;
    }

    if (password !== confirmPassword) {
      showError('confirmPassword', 'Passwords do not match');
      isValid = false;
    }

    return isValid;
  }

  // Handle Send OTP - IMPROVED
  document.getElementById('sendOtpBtn').addEventListener('click', async () => {
    if (!validateForm()) {
      return;
    }

    const form = document.getElementById('signupForm');
    const email = form.email.value.trim();
    const sendOtpBtn = document.getElementById('sendOtpBtn');

    // Disable button and show loading
    sendOtpBtn.disabled = true;
    sendOtpBtn.innerHTML = 'SENDING<span class="loading"></span>';

    try {
      const response = await fetch('/send-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email }),
      });

      // Check if response is JSON
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        throw new Error('Server returned invalid response. Please check server configuration.');
      }

      const data = await response.json();

      if (response.ok && data.message) {
        alert('Verification code sent to your email. Please check your inbox.');
        
        // Disable inputs
        form.role.disabled = true;
        form.name.disabled = true;
        form.email.disabled = true;
        form.password.disabled = true;
        form.confirmPassword.disabled = true;
        
        // Show OTP field
        sendOtpBtn.style.display = 'none';
        document.getElementById('otpField').style.display = 'block';
        document.getElementById('verifyBtn').style.display = 'block';
        document.getElementById('otp').focus();
      } else {
        alert(data.error || 'Failed to send verification code. Please try again.');
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = 'SEND VERIFICATION CODE';
      }
    } catch (err) {
      console.error('Error sending OTP:', err);
      let errorMsg = 'Error sending verification code. ';
      if (err.message.includes('Server returned invalid response')) {
        errorMsg += 'Server configuration error. Please contact support.';
      } else if (err.message.includes('Failed to fetch')) {
        errorMsg += 'Cannot connect to server. Please check your internet connection.';
      } else {
        errorMsg += err.message;
      }
      alert(errorMsg);
      sendOtpBtn.disabled = false;
      sendOtpBtn.textContent = 'SEND VERIFICATION CODE';
    }
  });

  // Handle Verify OTP - IMPROVED
  document.getElementById('verifyBtn').addEventListener('click', async () => {
    const form = document.getElementById('signupForm');
    const role = form.role.value.trim();
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const password = form.password.value;
    const otp = form.otp.value.trim();

    hideError('otp');

    if (!otp || otp.length !== 6) {
      showError('otp', 'Please enter the 6-digit verification code');
      return;
    }

    const verifyBtn = document.getElementById('verifyBtn');
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = 'VERIFYING<span class="loading"></span>';

    try {
      const response = await fetch('/verify-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ role, name, email, password, otp }),
      });

      // Check if response is JSON
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        throw new Error('Server returned invalid response. Please check server configuration.');
      }

      const data = await response.json();

      if (response.ok && data.message) {
        alert('Verification successful! Redirecting...');
        if (role === 'Doctor') {
          window.location.href = '/doctor_register';
        } else {
          window.location.href = '/patient_register';
        }
      } else {
        alert(data.error || 'Invalid verification code. Please try again.');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'VERIFY & CONTINUE';
      }
    } catch (err) {
      console.error('Error verifying OTP:', err);
      let errorMsg = 'Verification failed. ';
      if (err.message.includes('Server returned invalid response')) {
        errorMsg += 'Server configuration error. Please contact support.';
      } else if (err.message.includes('Failed to fetch')) {
        errorMsg += 'Cannot connect to server. Please check your internet connection.';
      } else {
        errorMsg += err.message;
      }
      alert(errorMsg);
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'VERIFY & CONTINUE';
    }
  });

  // Allow Enter key to submit
  document.getElementById('otp').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('verifyBtn').click();
    }
  });
</script>
</body>
</html>
