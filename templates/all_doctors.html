<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Doctors | RapiACT</title>
  <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='images/logo.jpg') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg-primary: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
      --bg-card: #16213e;
      --text-primary: #ffffff;
      --text-accent: #4facfe;
      --border-color: #2d3748;
      --gradient-accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --glassmorphism: rgba(22,33,62,0.48);
      --backdrop-blur: blur(15px);
      --shadow-medium: 0 8px 16px -3px rgba(0,0,0,0.39);
      --shadow-card: 0 13px 26px -13px rgba(102, 126, 234, 0.25);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      min-height: 100vh;
    }
    .navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: var(--glassmorphism);
      backdrop-filter: var(--backdrop-blur);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 20px;
      z-index: 1000;
      box-shadow: var(--shadow-medium);
    }
    .navbar .logo {
      display: flex;
      align-items: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-accent);
      text-decoration: none;
    }
    .navbar .logo i {
      margin-right: 10px;
      font-size: 2rem;
        background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .nav-links a {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      position: relative;
      padding: 8px 16px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .nav-links a:hover {
      color: var(--text-accent);
      background: rgba(255,255,255,0.12);
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--gradient-accent);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .nav-links a:hover::after {
      width: 80%;
    }
    section.section {
      padding: 120px 20px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-title {
      text-align: center;
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 700;
      margin-bottom: 20px;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .filter-container {
      background: var(--glassmorphism);
      backdrop-filter: var(--backdrop-blur);
      box-shadow: var(--shadow-card);
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 42px;
      border: 1px solid var(--border-color);
    }
    .filter-container input,
    .filter-container select,
    .filter-container button {
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      outline: none;
      box-shadow: var(--shadow-light);
      transition: all 0.3s ease;
    }
    .filter-container button {
      background: var(--gradient-accent);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-card);
    }
    .filter-container button:hover {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 80%);
    }
    .doctor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px,1fr));
      gap: 32px;
      justify-content: center;
    }
    .doctor-card {
      background: var(--glassmorphism);
      backdrop-filter: var(--backdrop-blur);
      border-radius: 22px;
      color: var(--text-primary);
      padding: 34px 22px 26px;
      text-align: center;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255,255,255,0.22);
      transition: transform 0.3s ease, background 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 310px;
      position: relative;
    }
    .doctor-card:hover {
      transform: translateY(-7px) scale(1.03);
      background: var(--gradient-accent);
      color: #fff;
    }
    .doctor-card img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 13px;
      border: 2.2px solid var(--text-accent);
      background: #fff;
      box-shadow: 0 4px 24px 2px rgba(79,172,254,0.15);
    }
    .doctor-card p {
      margin: 9px 0 0 0;
      font-size: 1.08rem;
      letter-spacing: 0.03em;
    }
    .doctor-card p strong {
      color: var(--text-accent);
      font-weight: 700;
    }
    footer {
      background: var(--bg-card);
      color: var(--text-primary);
      text-align: center;
      padding: 45px 20px 20px;
      border-top: 1px solid var(--border-color);
      margin-top: 80px;
      border-radius: 25px 25px 0 0;
      box-shadow: var(--shadow-medium);
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    @media (max-width: 768px) {
      .navbar { width: 97%; padding: 10px 6px;}
      section.section { padding: 40px 8px;}
      .doctor-grid { grid-template-columns: 1fr; gap: 25px;}
    }
  </style>
</head>
<body data-theme="dark">
  <nav class="navbar">
    <a href="/" class="logo"><i class="fas fa-heartbeat"></i>RapiACT</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/services">Services</a>
      <a href="/all_doctors">Doctors</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>
  <section class="section" style="padding-top:140px" id="all-doctors">
    <h2 class="section-title">Our Expert Doctors</h2>
    <div class="filter-container">
      <input type="text" id="search-name" placeholder="Search by Name">
      <select id="filter-specialization">
        <option value="">All Specializations</option>
      </select>
      <select id="filter-experience">
        <option value="">All Experience Levels</option>
        <option value="1">1+ Years</option>
        <option value="5">5+ Years</option>
        <option value="10">10+ Years</option>
      </select>
      <button onclick="applyFilters()">Apply Filters</button>
    </div>
    <div class="doctor-grid"></div>
  </section>
  <footer>
    <p>&copy; 2025 RapiACT. All Rights Reserved.</p>
  </footer>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("/get_doctors")
        .then(response => response.json())
        .then(doctors => {
          const doctorGrid = document.querySelector(".doctor-grid");
          const specializationDropdown = document.getElementById("filter-specialization");
          const specializations = [...new Set(doctors.map(doctor => doctor.specialization).filter(s => s))];
          specializations.forEach(specialization => {
            const option = document.createElement("option");
            option.value = specialization;
            option.textContent = specialization;
            specializationDropdown.appendChild(option);
          });
          function displayDoctors(filteredDoctors) {
            doctorGrid.innerHTML = "";
            if (filteredDoctors.length === 0) {
              doctorGrid.innerHTML = "<p>No doctors found.</p>";
              return;
            }
            filteredDoctors.forEach(doctor => {
              let doctorId = "";
              if (doctor._id) {
                doctorId = (typeof doctor._id === "object" && "$oid" in doctor._id)
                  ? doctor._id.$oid
                  : doctor._id;
              }
              const photoSrc = doctorId
                ? `/user_photo/${doctorId}`
                : 'static/images/logo.jpg';
              const doctorCard = document.createElement("div");
              doctorCard.classList.add("doctor-card");
              doctorCard.innerHTML = `
                <img src="${photoSrc}" alt="Doctor Image">
                <p><strong>Name:</strong> ${doctor.name}</p>
                <p><strong>Specialization:</strong> ${doctor.specialization}</p>
                <p><strong>Experience:</strong> ${doctor.years_experience || "N/A"} years</p>
              `;
              doctorGrid.appendChild(doctorCard);
            });
          }
          displayDoctors(doctors);
          window.applyFilters = function () {
            const nameFilter = document.getElementById("search-name").value.toLowerCase();
            const specializationFilter = specializationDropdown.value;
            const experienceFilter = document.getElementById("filter-experience").value;
            const filteredDoctors = doctors.filter(doctor => {
              return (
                (!nameFilter || doctor.name.toLowerCase().includes(nameFilter)) &&
                (!specializationFilter || doctor.specialization === specializationFilter) &&
                (!experienceFilter || (doctor.years_experience && doctor.years_experience >= parseInt(experienceFilter)))
              );
            });
            displayDoctors(filteredDoctors);
          };
        })
        .catch(error => console.error("Error fetching doctors:", error));
    });
  </script>
</body>
</html>
